name: TripleWin Daily Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # כל לילה בשעה 02:00 UTC = 05:00 בישראל
  workflow_dispatch:       # אפשרות להרצה ידנית מה-GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py
